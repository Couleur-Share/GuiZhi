<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'none';style-src 'unsafe-inline';img-src data:;base-uri 'none';form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动阅读验证</title><style>*{box-sizing:border-box}html{color-scheme:light;--theme-surface:#fafafa;--theme-text:#20242b}html[data-theme=dark]{color-scheme:dark;--theme-surface:#11151b;--theme-text:#e7eaf0}body{margin:0;background:var(--theme-surface);color:var(--theme-text);font:var(--reader-font-size,17px)/1.8 var(--reader-font-family,system-ui,sans-serif);overflow-wrap:anywhere}main{max-width:980px;margin:auto;padding:24px}img,svg,canvas{max-width:100%}img{height:auto}table{display:block;overflow-x:auto}pre{overflow:auto}button,input,select{font:inherit;color:inherit}button,summary{cursor:pointer;min-height:36px}button,input,select{background:var(--theme-surface);border:1px solid #8495a8;border-radius:6px;padding:4px 10px}a{color:inherit;text-underline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #368fbd;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}:root{--theme-visual-surface:#e5eef8;--theme-visual-1:#4477aa;--theme-visual-2:#228866;--theme-visual-3:#aa6677;--theme-visual-4:#997733;--theme-visual-5:#8866aa;--theme-visual-6:#337788}html[data-theme=dark]{--theme-visual-surface:#243448;--theme-visual-1:#82b0e2;--theme-visual-2:#72c7a8;--theme-visual-3:#e6a1b2;--theme-visual-4:#e1c16a;--theme-visual-5:#b69be5;--theme-visual-6:#7cbacb}.gz-reading-components{--color-base-100:var(--theme-surface);--color-base-200:var(--theme-visual-surface);--color-base-300:var(--theme-visual-1);--color-base-content:var(--theme-text);--color-primary:var(--theme-visual-1);--color-primary-content:var(--theme-surface);--radius-box:12px;--radius-field:8px;--radius-selector:6px;--border:1px;--size-field:.25rem;--depth:0;--noise:0;--tw-border-style:solid;--tw-font-weight:400;--spacing:.25rem}.gz-ui-timeline,.gz-ui-steps{padding:0}.gz-ui-timeline-end,.gz-ui-timeline-start{font-size:1em}.gz-ui-stat-value{font-size:1.5em}.gz-ui-card-body{padding:1.25em}.gz-ui-table{font-size:1em}.gz-ui-alert{display:block;padding:1em}</style></head><body class="gz-reading-components"><main><h1>互动阅读验证</h1><h2 id="body">完整正文</h2><p>这是一份用于验证独立阅读环境的完整文章。页面中的交互只改变本页的演示数值，原始知识条目始终独立保存。关闭增强交互以后，正文、图注和说明仍然可读。点击下方按钮，可以观察计数器变化；缩小阅读区以后，正文应自动换行。</p><section id="counter"><button id="add" type="button">增加</button> <output id="value">0</output><p>静态说明：按钮每次将计数增加一。</p></section><details open><summary>补充说明</summary><p>这段正文支持原生折叠，静态导出会展开。</p></details></main></body></html>
