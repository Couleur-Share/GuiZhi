<svg id="diagram" width="140" xmlns="http://www.w3.org/2000/svg" class="flowchart" height="260" viewBox="0 0 140 260" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#diagram{font-family:Arial,sans-serif;font-size:16px;fill:#182536;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:#e5eef8;}#diagram .error-text{fill:#1a1107;stroke:#1a1107;}#diagram .edge-thickness-normal{stroke-width:1px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#4477aa;stroke:#4477aa;}#diagram .marker.cross{stroke:#4477aa;}#diagram svg{font-family:Arial,sans-serif;font-size:16px;}#diagram p{margin:0;}#diagram .label{font-family:Arial,sans-serif;color:#182536;}#diagram .cluster-label text{fill:#1a1107;}#diagram .cluster-label span{color:#1a1107;}#diagram .cluster-label span p{background-color:transparent;}#diagram .label text,#diagram span{fill:#182536;color:#182536;}#diagram .node rect,#diagram .node circle,#diagram .node ellipse,#diagram .node polygon,#diagram .node path{fill:#e5eef8;stroke:#4477aa;stroke-width:1px;}#diagram .rough-node .label text,#diagram .node .label text,#diagram .image-shape .label,#diagram .icon-shape .label{text-anchor:middle;}#diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram .rough-node .label,#diagram .node .label,#diagram .image-shape .label,#diagram .icon-shape .label{text-align:center;}#diagram .node.clickable{cursor:pointer;}#diagram .root .anchor path{fill:#4477aa!important;stroke-width:0;stroke:#4477aa;}#diagram .arrowheadPath{fill:#0b0b0b;}#diagram .edgePaths .path{stroke:#4477aa;stroke-width:1px;}#diagram .flowchart-link{stroke:#4477aa;fill:none;}#diagram .edgeLabel{background-color:#e5eef8;text-align:center;}#diagram .edgeLabel p{background-color:#e5eef8;}#diagram .edgeLabel rect{opacity:0.5;background-color:#e5eef8;fill:#e5eef8;}#diagram .labelBkg{background-color:rgba(229, 238, 248, 0.5);}#diagram .cluster rect{fill:#e5eef8;stroke:hsl(211.5789473684, 17.5757575758%, 83.5294117647%);stroke-width:1px;}#diagram .cluster text{fill:#1a1107;}#diagram .cluster span{color:#1a1107;}#diagram .node .collapsed-indicator{fill:hsl(211.5789473684, 17.5757575758%, 83.5294117647%);stroke:none;opacity:0.6;}#diagram .node .collapsed-separator{stroke:hsl(211.5789473684, 17.5757575758%, 83.5294117647%);stroke-width:0.75px;}#diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,sans-serif;font-size:12px;background:#e5eef8;border:1px solid hsl(211.5789473684, 17.5757575758%, 83.5294117647%);border-radius:2px;pointer-events:none;z-index:100;}#diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#182536;}#diagram rect.text{fill:none;stroke-width:0;}#diagram .icon-shape,#diagram .image-shape{background-color:#e5eef8;text-align:center;}#diagram .icon-shape p,#diagram .image-shape p{background-color:#e5eef8;padding:2px;}#diagram .icon-shape .label rect,#diagram .image-shape .label rect{opacity:0.5;background-color:#e5eef8;fill:#e5eef8;}#diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram .node .neo-node{stroke:#4477aa;}#diagram [data-look="neo"].node rect,#diagram [data-look="neo"].cluster rect,#diagram [data-look="neo"].node polygon{stroke:url(#diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,