services:
  capture:
    image: ${CAPTURE_IMAGE:?Set a fixed release tag or digest}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:48787:8787"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./secrets/backup.key:/run/secrets/backup.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.75
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
