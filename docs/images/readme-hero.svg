<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">归知 GuiZhi</title>
  <desc id="desc">本地优先的 AI 个人知识库：资料从多种来源进入归知，经提取、整理与本地索引，成为可检索、可追溯、可互联的个人知识。</desc>
  <defs>
    <clipPath id="hero-clip" clipPathUnits="userSpaceOnUse">
      <rect width="1280" height="640" rx="34"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset="0.52" stop-color="#111722"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78a7ff"/>
      <stop offset="1" stop-color="#376fe4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#171e2a"/>
      <stop offset="1" stop-color="#111721"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4f83ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4f83ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <style>
      .sans { font-family: Inter, "SF Pro Display", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .muted { fill: #9aa7ba; }
      .line { stroke: #283348; stroke-width: 2; }
      .label { fill: #718198; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

