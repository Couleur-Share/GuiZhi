name: Desktop Build and Release (Go shell)

# Go + WebView2 外壳（spikes/mygo-shell）的灰度发布流水线。
# 打 v*-go.* tag（例如 v0.29.0-go.1）触发：构建 Go 壳 → NSIS 安装包 → 离屏启动冒烟 →
# 校验更新清单 → 创建 Draft 预发布。验证通过后维护者手动执行
#   gh release edit <tag> --draft=false --prerelease
# 对外发布。
#
# 与 release.yml 的分工：release.yml 排除了 *-go.* tag，只负责 Electron 版；
# 本文件只负责 Go 壳。Go 壳版本号必须带 -go.N 后缀，这样更新通道把它当预发布线，稳定通道用户不会收到。
# 仅 Windows x64；安装包未做代码签名（与 Electron 版一致）。

on:
  push:
    tags:
      - "v*-go.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 手动触发（workflow_dispatch）只构建并上传工作流产物，不创建 Release
      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          case "${VERSION}" in
            *-go.*) ;;
            *) echo "Go 壳版本号必须带 -go.N 后缀（当前 ${VERSION}）"; exit 1 ;;
          esac
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 apps/desktop/package.json 版本 v${VERSION} 不一致"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-x64-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-x64-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: spikes/mygo-shell/go.mod
          cache-dependency-path: spikes/mygo-shell/go.sum

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Go shell
        shell: pwsh
        run: ./spikes/build-shell.ps1

      - name: Build installer
        shell: pwsh
        run: ./spikes/build-installer.ps1

      # 在全新的 WebView2 配置和临时数据目录里离屏启动一次：
      # 验证 exe、内置 SQLite 原生库、渲染产物齐全，且全部 IPC 频道都有处理器、首次安装界面为中文。
      - name: Smoke test built shell
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "mygo-smoke"
          New-Item -ItemType Directory -Force $t | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $t "wv"
          $p = Start-Process -FilePath "spikes\mygo-shell\out\win-x64\GuiZhi.exe" `
            -ArgumentList "-userdata", "$t\ud", "-appdata", $t, "-shot", "$t\a.png" `
            -PassThru -Wait -RedirectStandardError "$t\err.txt" -RedirectStandardOutput "$t\out.txt"
          Get-Content "$t\err.txt", "$t\out.txt" | Select-Object -First 40
          if ($p.ExitCode -ne 0) { throw "离屏启动失败，退出码 $($p.ExitCode)" }
          if (-not (Test-Path "$t\a.png")) { throw "没有生成截图" }
          $err = Get-Content "$t\err.txt" -Raw
          $out = Get-Content "$t\out.txt" -Raw
          if ($err -notmatch "均已有处理器") { throw "IPC 频道自检没有通过" }
          if ($out -notmatch "知识库") { throw "首次启动界面不是中文" }
          if ($out -notmatch "其中 0 个未实现") { throw "渲染进程调用了未实现的 IPC 频道" }

      - name: Prepare release assets
        working-directory: apps/desktop
        run: |
          mkdir -p ../../release_assets
          INSTALLER="../../spikes/mygo-shell/out/installer"
          cp "${INSTALLER}/GuiZhi-Setup-${VERSION}-x64.exe" ../../release_assets/
          cp "${INSTALLER}/latest.yml" ../../release_assets/latest.yml
          node scripts/fix-latest-yml.js --file ../../release_assets/latest.yml --arch x64
          cp ../../release_assets/latest.yml ../../release_assets/latest-x64.yml
          # 校正并校验更新清单哈希（错配即中止，防坏自动更新）
          node scripts/fix-manifest-hashes.js ../../release_assets/latest.yml ../../release_assets/latest-x64.yml
          node scripts/verify-update-manifest.js ../../release_assets/latest.yml ../../release_assets/latest-x64.yml
          ls -1 ../../release_assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: win-x64-go-build
          path: release_assets/*
          if-no-files-found: error

      - name: Create Draft prerelease
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version;
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const headings = [...text.matchAll(/^## v\d+\.\d+\.\d+.*$/gm)];
          if (!headings[0]) throw new Error('CHANGELOG 没有版本小节');
          if (!headings[0][0].startsWith(`## v${version}`)) throw new Error(`CHANGELOG 顶部小节不是 v${version}`);
          const body = text.slice(headings[0].index, headings[1]?.index).trim();
          const url = `https://github.com/Couleur-Share/GuiZhi/releases/download/v${version}/GuiZhi-Setup-${version}-x64.exe`;
          fs.writeFileSync('release_notes.md', `[下载 Windows x64 安装包（Go 壳灰度预览版）](${url})\n\n${body}\n`);
          NODE

          # 始终是预发布；创建或更新 Draft（验证后手动 promote）
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Updating assets in place..."
            IS_DRAFT=$(gh release view "${GITHUB_REF_NAME}" --json isDraft -q .isDraft)
            gh release edit "${GITHUB_REF_NAME}" \
              --title "归知 GuiZhi ${VERSION}" \
              --notes-file release_notes.md \
              --draft=${IS_DRAFT} \
              --prerelease=true
            gh release upload "${GITHUB_REF_NAME}" release_assets/* --clobber
          else
            echo "Creating DRAFT prerelease..."
            gh release create "${GITHUB_REF_NAME}" \
              release_assets/* \
              --title "归知 GuiZhi ${VERSION}" \
              --notes-file release_notes.md \
              --draft=true \
              --prerelease=true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
