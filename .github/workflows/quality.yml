name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 版本读取 package.json 的 packageManager 字段，避免双处声明冲突
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42 起安装依赖不再下载二进制，首次启动时才按需下载；预先下载让冒烟测试不受下载时机影响
      - name: Download Electron binary
        run: pnpm --filter @guizhi/desktop exec install-electron --no

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm --filter @guizhi/desktop build

      - name: Check renderer bundle budget
        run: pnpm --filter @guizhi/desktop bundle:budget

      # Electron 在 Linux 上必须有显示服务器；无 Xvfb 时窗口起不来，
      # firstWindow / locator 会一直等到测试超时。构建步骤已经产出 out/，
      # 这里只跑用例，避免再编一遍。
      - name: Install Xvfb for Electron smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Electron smoke tests
        working-directory: apps/desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a pnpm exec playwright test smoke.spec.ts

  # Go 壳（主线）：构建渲染层与 Go 壳后，跑 vet 与全量单测。
  # 全量测试会拉起真实 WebView2 隐藏窗口（采集、渲染、阅读视图），所以必须在 Windows 上跑，约 2 分钟。
  desktop-go:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop-go/go.mod
          cache-dependency-path: apps/desktop-go/go.sum

      # 门禁：Go 壳的生成、构建与测试不得依赖 Electron 主进程目录。依赖已装好，此处删掉后再往下走，
      # 任何重新引入的依赖（含 jsgen 的 TS 源码）都会在这里之后立刻失败。
      - name: Remove Electron main process sources
        shell: pwsh
        run: Remove-Item apps/desktop/src/main -Recurse -Force

      # goja 产物（themed_engine.js 等）由 apps/desktop-go/jsrc 的 TS 源码生成；重新生成必须与入库版本逐字节一致。
      - name: Regenerate goja bundles and verify committed output
        shell: pwsh
        run: |
          pnpm --filter @guizhi/desktop-go gen
          if ($LASTEXITCODE) { throw "重新生成 goja 产物失败" }
          git diff --exit-code -- apps/desktop-go
          if ($LASTEXITCODE) { throw "重新生成的产物与入库版本不一致：改了 jsrc 或 jsgen 后需重新生成并提交" }

      # jsrc 里 TS 源码的单测（原先在 apps/desktop 下，随源码迁来）。在删除 src/main 之后运行，证明它们不依赖 Electron 主进程。
      - name: jsrc unit tests
        run: pnpm --filter @guizhi/desktop-go test

      # 构建脚本同时产出测试依赖的 dist/ 与 reading_libraries.json，必须先于 go test 运行
      - name: Build Go shell
        shell: pwsh
        run: ./apps/desktop-go/scripts/build-shell.ps1

      - name: Go vet
        working-directory: apps/desktop-go
        run: go vet ./...

      - name: Go tests
        working-directory: apps/desktop-go
        run: go test -count=1 ./...