name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 版本读取 package.json 的 packageManager 字段，避免双处声明冲突
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # worker 的正文清理只依赖 lxml：版本取自随包运行时的锁文件，与交付的解析器一致，
      # 不安装 Crawl4AI 全量依赖。经完整转换链路的回归见 scripts/tests/test_article_cleanup.py（需随包 Python）。
      - name: Crawler worker cleanup tests
        shell: bash
        run: |
          pin="$(grep -oE '^lxml==[0-9.]+' config/crawl4ai/win32-x64.lock)"
          test -n "$pin" || { echo "::error::锁文件中找不到 lxml 固定版本"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/worker-venv"
          "$RUNNER_TEMP/worker-venv/bin/pip" install --quiet "$pin"
          "$RUNNER_TEMP/worker-venv/bin/python" scripts/tests/test_article_cleanup_comments.py

      - name: Unit tests
        run: pnpm test:unit

      # 运行包裁剪清单与锁文件、构建脚本的约定；不下载依赖，几秒内完成。
      - name: Crawler build helper tests
        run: |
          python3 scripts/tests/test_crawl4ai_prune.py
          python3 scripts/tests/test_crawl4ai_build_encoding.py

      # extract-only.py 的 stdio 协议：提取异常按协议回报、进程继续服务。用桩 extract 模块，不需要 Crawl4AI。
      - name: Crawler worker protocol tests
        run: python3 scripts/tests/test_extract_only_protocol.py

      - name: Build
        run: pnpm --filter @guizhi/desktop build

      - name: Check renderer bundle budget
        run: pnpm --filter @guizhi/desktop bundle:budget

      # Electron 在 Linux 上必须有显示服务器；无 Xvfb 时窗口起不来，
      # firstWindow / locator 会一直等到测试超时。构建步骤已经产出 out/，
      # 这里只跑用例，避免再编一遍。
      - name: Install Xvfb for Electron smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Electron smoke tests
        working-directory: apps/desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a pnpm exec playwright test smoke.spec.ts
