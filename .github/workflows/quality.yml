name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 渲染层与工具链的快速检查（Linux）。仅为通用质量检查，不代表 Linux 桌面版获得官方支持。
  desktop-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 版本读取 package.json 的 packageManager 字段，避免双处声明冲突
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 验证工具（node:test）与渲染进程 / 共享包单测。Go 壳 TS 层（jsrc）的单测在 desktop-go 作业里跑。
      - name: Unit tests
        run: |
          pnpm test:validation
          pnpm --filter @guizhi/desktop test:unit

  # Go 壳（主线）：构建渲染层与 Go 壳后，跑 vet 与全量单测。
  # 全量测试会拉起真实 WebView2 隐藏窗口（采集、渲染、阅读视图），所以必须在 Windows 上跑，约 2 分钟。
  desktop-go:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop-go/go.mod
          cache-dependency-path: apps/desktop-go/go.sum

      # goja 产物（themed_engine.js 等）由 apps/desktop-go/jsrc 的 TS 源码生成；重新生成必须与入库版本逐字节一致。
      - name: Regenerate goja bundles and verify committed output
        shell: pwsh
        run: |
          pnpm --filter @guizhi/desktop-go gen
          if ($LASTEXITCODE) { throw "重新生成 goja 产物失败" }
          git diff --exit-code -- apps/desktop-go
          if ($LASTEXITCODE) { throw "重新生成的产物与入库版本不一致：改了 jsrc 或 jsgen 后需重新生成并提交" }

      # jsrc 里 TS 源码的单测（goja 嵌入产物的输入）。
      - name: jsrc unit tests
        run: pnpm --filter @guizhi/desktop-go test

      # 构建脚本同时产出测试依赖的 dist/ 与 reading_libraries.json，必须先于 go test 运行
      - name: Build Go shell
        shell: pwsh
        run: ./apps/desktop-go/scripts/build-shell.ps1

      - name: Go vet
        working-directory: apps/desktop-go
        run: go vet ./...

      - name: Go tests
        working-directory: apps/desktop-go
        run: go test -count=1 ./...

      # Go 壳 UI 烟雾检查：隔离构建 → 离屏启动 → 经 CDP 驱动真实界面（启动、渲染、IPC、SQLite、列表/详情交互、导航）。
      # 构建过程同时检查渲染层包体预算。
      - name: Go shell UI smoke
        run: pnpm shot --steps apps/desktop-go/scripts/steps/smoke-steps.mjs --out ${{ runner.temp }}/go-smoke

      - name: Upload Go shell UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-shell-ui-smoke
          path: ${{ runner.temp }}/go-smoke/*.png
          if-no-files-found: ignore