name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 版本读取 package.json 的 packageManager 字段，避免双处声明冲突
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm --filter @guizhi/desktop build

      - name: Check renderer bundle budget
        run: pnpm --filter @guizhi/desktop bundle:budget

      # Electron 在 Linux 上必须有显示服务器；无 Xvfb 时窗口起不来，
      # firstWindow / locator 会一直等到测试超时。构建步骤已经产出 out/，
      # 这里只跑用例，避免再编一遍。
      - name: Install Xvfb for Electron smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Electron smoke tests
        working-directory: apps/desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a pnpm exec playwright test smoke.spec.ts
