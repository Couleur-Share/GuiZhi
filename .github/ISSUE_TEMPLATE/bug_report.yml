name: 问题反馈 / Bug report
title: "[BUG] "
description: 反馈你遇到的问题 / Report the issue you are experiencing
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：

        1. 请 **确保** 您已经查阅了 [README](https://github.com/Couleur-Share/GuiZhi#readme)、[文档](https://github.com/Couleur-Share/GuiZhi/blob/main/docs/README.md) 与 [已知限制](https://github.com/Couleur-Share/GuiZhi/blob/main/docs/known-limitations.md)
        2. 请 **确保** [已有的问题](https://github.com/Couleur-Share/GuiZhi/issues?q=is%3Aissue) 中没有人提交过相似 issue，否则请在已有的 issue 下讨论
        3. 请 **务必** 给 issue 填写一个简洁明了的标题，以便他人快速检索
        4. 请 **务必** 确认问题在 [最新 Release](https://github.com/Couleur-Share/GuiZhi/releases/latest) 上仍然存在
        5. 请 **务必** 按模板填写复现步骤与日志；缺少关键信息的 issue 可能被直接关闭

        ## Before submitting the issue, please make sure of the following checklist:

        1. Please make sure you have read the [README](https://github.com/Couleur-Share/GuiZhi#readme), [docs](https://github.com/Couleur-Share/GuiZhi/blob/main/docs/README.md) and [Known limitations](https://github.com/Couleur-Share/GuiZhi/blob/main/docs/known-limitations.md)
        2. Please make sure there is no similar issue in the [existing issues](https://github.com/Couleur-Share/GuiZhi/issues?q=is%3Aissue); otherwise discuss under the existing issue
        3. Please fill in a concise and clear title so others can find it quickly
        4. Please confirm the problem still exists on the [latest Release](https://github.com/Couleur-Share/GuiZhi/releases/latest)
        5. Please fill in reproduction steps and logs according to the template; issues missing critical information may be closed

  - type: dropdown
    id: area
    attributes:
      label: 功能模块 / Area
      description: 问题主要出现在哪一块 / Which part of GuiZhi is affected?
      options:
        - 知识库 / Library
        - 采集导入 / Capture & import
        - AI 问答 / Ask
        - Wiki
        - 模型服务 / Model settings
        - 正文配图 / Illustrations
        - 转写与媒体 / Transcription & media
        - MCP 接入 / MCP
        - 备份与配置迁移 / Backup & config transfer
        - 设置 / 外观 / Settings & appearance
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并配合截图 / Describe the problem clearly, and attach screenshots if possible
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      description: 关于页或安装包文件名中的版本号 / Version from About or the installer filename
      placeholder: e.g. 0.13.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供复现问题的步骤 / Steps to reproduce the behavior
      placeholder: |
        1. …
        2. …
        3. 观察到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么 / What did you expect to happen?
    validations:
      required: true

  - type: checkboxes
    id: os
    attributes:
      label: 操作系统 / OS
      options:
        - label: Windows
        - label: Linux
        - label: macOS（实验 / experimental）
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 操作系统版本 / OS Version
      description: 例如 Windows 11 24H2、Ubuntu 24.04 + GNOME / e.g. Windows 11 24H2, Ubuntu 24.04 + GNOME
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Log
      description: |
        请粘贴相关日志内容（不要上传整个日志文件）。可在「设置 → 数据 → 打开日志」打开目录，优先贴 `error.log` / `startup.log` 中相关片段。
        Paste relevant log content (do not upload the whole file). Open the folder via Settings → Data → Open Logs; prefer excerpts from `error.log` / `startup.log`.
      placeholder: |
        相关日志粘贴在这里。
        Paste the relevant log excerpt here.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索过现有 issue，没有发现明显重复 / I searched existing issues and did not find an obvious duplicate
          required: true
        - label: 我在当前最新可用版本上仍能复现 / I can still reproduce this on the latest available build
          required: true
