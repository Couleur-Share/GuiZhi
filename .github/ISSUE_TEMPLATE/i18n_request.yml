name: I18N / 多语言相关
title: "[I18N] "
description: 用于多语言翻译、国际化相关问题或建议 / For issues or suggestions related to translations and internationalization
labels: ["i18n"]

body:
  - type: markdown
    attributes:
      value: |
        ## I18N 相关问题/建议

        请用此模板提交翻译错误、缺失、建议或新增语言请求。
        文案文件位于 `apps/desktop/src/renderer/i18n/locales/`（目前提供 `zh` / `en`）。

        Please use this template for translation errors, missing translations, suggestions, or new language requests.
        Locale files live under `apps/desktop/src/renderer/i18n/locales/` (currently `zh` / `en`).

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 详细描述你的 I18N 问题或建议 / Please describe your I18N issue or suggestion in detail
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: 相关语言 / Language
      description: 例如 zh, en, … / e.g. zh, en, …
      placeholder: zh
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议或修正内容 / Suggestion or Correction
      description: 如果是翻译修正或建议，请填写建议的内容（可附上 i18n key） / If this is a translation correction or suggestion, provide the suggested text (include the i18n key if known)
    validations:
      required: false

  - type: checkboxes
    id: i18n-type
    attributes:
      label: 问题类型 / Issue Type
      description: 请选择适用类型（可多选） / Please select the applicable type(s)
      options:
        - label: 翻译错误 / Translation error
        - label: 翻译缺失 / Missing translation
        - label: 建议优化 / Suggestion
        - label: 新增语言 / New language
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      description: 请提供你使用的归知具体版本 / Please provide the GuiZhi version you are using
      placeholder: e.g. 0.13.0
    validations:
      required: true
